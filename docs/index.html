        </div>
        <div class="hw-type-card locked" title="Coming soon">
          <span class="hw-icon">🔌</span>
          <div class="hw-name">Controller</div>
          <div class="hw-desc">Coming soon</div>
        </div>
      </div>
    `;
    // Unlock GPU if researched
    if (Game.tech.isResearched('gpu_basic')) {
      body.querySelectorAll('.hw-type-card')[1].classList.remove('locked');
      body.querySelectorAll('.hw-type-card')[1].removeAttribute('title');
      body.querySelectorAll('.hw-type-card')[1].onclick = () => Notify.show('GPU creator coming soon!', 'info');
    }
  }

  function _openCpuCreator() {
    UI.closeWindow('hardware');

    const processes = Game.tech.getAvailableProcesses();
    const maxFreq   = Game.tech.getMaxFreq();
    const hasPipeline = Game.tech.isResearched('arch_pipeline');
    const hasL2 = Game.tech.isResearched('cache_l2');

    const el = UI.createWindow({
      id: 'cpu_creator',
      title: '💾 Design CPU',
      width: 600,
      height: 580,
    });

    const body = UI.getWindowBody('cpu_creator');
    body.innerHTML = `
      <div class="cpu-config-grid">
        <div>
          <div class="form-group">
            <label class="form-label">CPU Name</label>
            <input type="text" class="form-input" id="cpu-name" placeholder="e.g. Turbo-X 486" maxlength="24">
          </div>
          <div class="form-group">
            <label class="form-label">Process Node</label>
            <select class="form-select" id="cpu-process" onchange="App._recalcCpu()">
              ${processes.map(p => `<option value="${p}">${p}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Silicon Density</label>
            <select class="form-select" id="cpu-density" onchange="App._recalcCpu()">
              <option value="Low">Low</option>
              <option value="Standard" selected>Standard</option>
              ${hasPipeline ? '<option value="High">High</option>' : ''}
              ${hasL2 ? '<option value="Ultra">Ultra</option>' : ''}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Frequency (MHz): <span id="freq-val">${Math.min(maxFreq, 33)}</span></label>
            <input type="range" class="form-input" id="cpu-freq" min="1" max="${maxFreq}" value="${Math.min(maxFreq, 33)}" oninput="document.getElementById('freq-val').textContent=this.value;App._recalcCpu()">
          </div>
          <div class="form-group">
            <label class="form-label">Cache</label>
            <select class="form-select" id="cpu-cache" onchange="App._recalcCpu()">
              <option value="8">8 KB L1</option>
              <option value="16" selected>16 KB L1</option>
              <option value="32">32 KB L1</option>
              ${hasL2 ? '<option value="64">64 KB L2</option><option value="128">128 KB L2</option>' : ''}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">RAM Controller</label>
            <select class="form-select" id="cpu-ram">
              <option value="external">External</option>
              <option value="internal">Internal</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-check"><input type="checkbox" id="cpu-oc" onchange="App._recalcCpu()"> Enable Overclocking (+10% freq, ↑ temp/instability)</label>
          </div>
        </div>

        <div>
          <div class="stat-preview">
            <div class="stat-preview-title">📊 Estimated Stats</div>
            <div class="stat-grid" id="cpu-stats-preview">
              <div class="stat-item"><span class="s-label">MIPS</span><span class="s-value" id="s-mips">—</span></div>
              <div class="stat-item"><span class="s-label">IPC</span><span class="s-value" id="s-ipc">—</span></div>
              <div class="stat-item"><span class="s-label">TDP</span><span class="s-value" id="s-tdp">—</span></div>
              <div class="stat-item"><span class="s-label">Temp °C</span><span class="s-value" id="s-temp">—</span></div>
              <div class="stat-item"><span class="s-label">Reliability</span><span class="s-value" id="s-rel">—</span></div>
              <div class="stat-item"><span class="s-label">Unit Cost</span><span class="s-value" id="s-ucost">—</span></div>
              <div class="stat-item"><span class="s-label">Dev Time</span><span class="s-value" id="s-dtime">—</span></div>
              <div class="stat-item"><span class="s-label">Dev Cost</span><span class="s-value" id="s-dcost">—</span></div>
            </div>
          </div>

          <div class="stat-preview" style="margin-top:8px">
            <div class="stat-preview-title">💡 Cooler</div>
            <select class="form-select" id="cpu-cooler" onchange="App._recalcCpu()">
              <option value="stock">Stock Fan</option>
              <option value="tower">Tower Cooler</option>
              <option value="liquid">Liquid Cooling</option>
            </select>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" onclick="UI.closeWindow('cpu_creator')">Cancel</button>
        <button class="btn primary" onclick="App._submitCpu()">🔧 Begin Development</button>
      </div>
    `;
    _recalcCpu();
  }

  function _recalcCpu() {
    const process  = document.getElementById('cpu-process')?.value;
    const density  = document.getElementById('cpu-density')?.value;
    const freq     = parseInt(document.getElementById('cpu-freq')?.value || 33);
    const overclock= document.getElementById('cpu-oc')?.checked;
    const cooler   = document.getElementById('cpu-cooler')?.value;

    if (!process) return;
    const cfg = { process, density, frequency: freq, overclock };
    const s = Game.hw.calcCpuStats(cfg);

    const coolBonus = cooler === 'liquid' ? -20 : cooler === 'tower' ? -10 : 0;

    document.getElementById('s-mips').textContent = s.mips;
    document.getElementById('s-ipc').textContent  = s.ipc;
    document.getElementById('s-tdp').textContent  = s.tdp + 'W';
    document.getElementById('s-temp').textContent = (s.temp + coolBonus) + '°C';
    document.getElementById('s-rel').textContent  = s.reliability + '%';
    document.getElementById('s-ucost').textContent= Utils.formatMoney(s.unitCost);
    document.getElementById('s-dtime').textContent= s.devDays + 'd';
    document.getElementById('s-dcost').textContent= Utils.formatMoney(s.devCost, true);
  }

  function _submitCpu() {
    const name = document.getElementById('cpu-name')?.value.trim();
    if (!name) { Notify.show('Enter a CPU name!', 'error'); return; }
    const cfg = {
      name,
      process:   document.getElementById('cpu-process').value,
      density:   document.getElementById('cpu-density').value,
      frequency: parseInt(document.getElementById('cpu-freq').value),
      overclock: document.getElementById('cpu-oc').checked,
      cooler:    document.getElementById('cpu-cooler').value,
      cache:     document.getElementById('cpu-cache').value,
      ram:       document.getElementById('cpu-ram').value,
    };
    const stats = Game.hw.calcCpuStats(cfg);
    if (Game.finance.getCash() < stats.devCost * 0.1) {
      Notify.show('Insufficient funds for development!', 'error'); return;
    }
    Game.hw.createCpu(cfg);
    UI.closeWindow('cpu_creator');
    UI._renderProjectsPanel();
  }

  // ---- CONTRACTS APP ----
  function openContracts() {
    const el = UI.createWindow({
      id: 'contracts',
      title: '📋 Contracts',
      width: 520,
      height: 450,
    });
    _renderContracts();
    setInterval(_renderContracts, 5000);
  }

  function _renderContracts() {
    const body = UI.getWindowBody('contracts');
    if (!body) return;

    const available = Game.contracts.getAvailable();
    const active    = Game.contracts.getActive();
    const products  = Game.hw.getProducts();

    const prodOptions = products.map(p => `<option value="${p.id}">${p.name} (${p.stats.mips} MIPS)</option>`).join('');

    const availHTML = available.length ? available.map(c => `
      <div class="contract-card">
        <div class="contract-card-header">
          <span class="contract-company">${c.company}</span>
          <span class="contract-value">${Utils.formatMoney(c.monthlyRevenue, true)}/mo</span>
        </div>
        <div class="contract-specs">
          <span class="spec-chip">≥${c.minMips} MIPS</span>
          <span class="spec-chip">${c.qty.toLocaleString()} units</span>
          <span class="spec-chip">1 year</span>
        </div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:6px">${c.description}</div>
        ${products.length ? `
          <div style="display:flex;gap:6px;align-items:center">
            <select class="form-select" id="cpick_${c.id}" style="flex:1">
              <option value="">— Select product —</option>
              ${prodOptions}
            </select>
            <button class="btn primary" style="padding:5px 10px;font-size:12px" onclick="App._acceptContract('${c.id}')">Accept</button>
          </div>` : `<div style="font-size:11px;color:var(--red)">No products available</div>`}
      </div>`) .join('') : `<div style="color:var(--text2);font-size:12px;padding:8px">No available contracts. Check back soon.</div>`;

    const activeHTML = active.length ? active.map(c => {
      const pct = Math.round(((c.durationDays - c.daysLeft) / c.durationDays) * 100);
      return `<div class="contract-card">
        <div class="contract-card-header">
          <span class="contract-company">${c.company}</span>
          <span class="contract-value">${Utils.formatMoney(c.monthlyRevenue, true)}/mo</span>
        </div>
        <div class="contract-specs">
          <span class="spec-chip badge-contract">Active</span>
          <span class="spec-chip">${Math.round(c.daysLeft)}d left</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%;background:var(--green)"></div>
        </div>
      </div>`;
    }).join('') : `<div style="color:var(--text2);font-size:12px;padding:8px">No active contracts.</div>`;

    body.innerHTML = `
      <div class="tabs">
        <div class="tab-btn active" onclick="UI._switchTab(this,'avail-tab')">Available (${available.length})</div>
        <div class="tab-btn" onclick="UI._switchTab(this,'active-tab')">Active (${active.length})</div>
      </div>
      <div id="avail-tab" class="tab-pane active">${availHTML}</div>
      <div id="active-tab" class="tab-pane">${activeHTML}</div>
    `;
  }

  function _acceptContract(contractId) {
    const sel = document.getElementById('cpick_' + contractId);
    if (!sel || !sel.value) { Notify.show('Select a product first!', 'error'); return; }
    Game.contracts.accept(contractId, sel.value);
    _renderContracts();
  }

  // ---- RESEARCH APP ----
  function openResearch() {
    const el = UI.createWindow({
      id: 'research',
      title: '🔬 Research & Development',
      width: 760,
      height: 500,
    });
    _renderResearch();
  }

  function _renderResearch() {
    const body = UI.getWindowBody('research');
    if (!body) return;

    const tree = Game.tech.getTree();
    const researched = Game.tech.getResearched();
    const inProgress = Game.tech.getInProgress();

    // Build tree canvas
    const canvasH = Math.max(...tree.map(n => n.y)) + 120;
    const canvasW = Math.max(...tree.map(n => n.x)) + 160;

    // SVG lines for dependencies
    let svgLines = '';
    for (const node of tree) {
      for (const prereq of node.prereqs) {
        const parent = tree.find(n => n.id === prereq);
        if (!parent) continue;
        const x1 = parent.x + 60, y1 = parent.y + 20;
        const x2 = node.x + 60,   y2 = node.y + 20;
        const color = researched.has(node.id) ? '#00e676' : researched.has(prereq) ? '#2a3548' : '#1a2030';
        svgLines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2"/>`;
      }
    }

    const nodesHTML = tree.map(n => {
      const done = researched.has(n.id);
      const prog = inProgress.has(n.id);
      const avail = Game.tech.isAvailable(n.id);
      let cls = done ? 'researched' : prog ? 'researching' : avail ? 'available' : 'locked';
      const daysLeft = prog ? Math.round(inProgress.get(n.id).daysLeft) : null;
      const costStr  = n.cost > 0 ? Utils.formatMoney(n.cost, true) : 'Free';
      const action   = (!done && !prog && avail)
        ? `onclick="App._startResearch('${n.id}')"` : '';
      return `<div class="tech-node ${cls}" style="left:${n.x}px;top:${n.y}px" ${action} title="${n.desc||n.name}">
        <div class="tech-node-name">${n.name}</div>
        <div class="tech-node-cat">${n.cat}</div>
        <div class="tech-node-cost">${done?'✓ Done':prog?`~${daysLeft}d`:costStr}</div>
      </div>`;
    }).join('');

    // Active research sidebar
    const activeResearch = [...inProgress.entries()].map(([id, prog]) => {
      const t = Game.tech.getNode(id);
      const pct = Math.round((1 - prog.daysLeft / (prog.daysLeft / (prog.effortPct / 100))) * 100); // approx
      return `<div class="active-research-item">
        <div style="font-weight:700;font-size:11px;color:var(--white)">${t?.name}</div>
        <div style="font-size:10px;color:var(--text2);margin-top:3px">~${Math.round(prog.daysLeft)}d left</div>
        <div style="font-size:10px;color:var(--yellow)">Effort: ${prog.effortPct}%</div>
      </div>`;
    }).join('') || '<div style="font-size:11px;color:var(--text2)">No active research</div>';

    body.innerHTML = `
      <div class="research-layout">
        <div class="tech-tree-canvas" style="min-height:${canvasH}px">
          <svg style="position:absolute;top:0;left:0;width:${canvasW}px;height:${canvasH}px;pointer-events:none">
            ${svgLines}
          </svg>
          <div style="position:relative;width:${canvasW}px;height:${canvasH}px">
            ${nodesHTML}
          </div>
        </div>
        <div class="research-sidebar">
          <div class="section-header">Active Research</div>
          ${activeResearch}
          <div style="margin-top:12px">
            <div class="section-header">Legend</div>
            <div style="font-size:10px;color:var(--text2);line-height:2">
              <span style="color:var(--green)">■</span> Done<br>
              <span style="color:var(--yellow)">■</span> In progress<br>
              <span style="color:var(--accent)">■</span> Available<br>
              <span style="color:var(--text2)">■</span> Locked
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function _startResearch(id) {
    const t = Game.tech.getNode(id);
    if (!t) return;
    if (t.cost > 0 && Game.finance.getCash() < t.cost * 0.05) {
      Notify.show('Insufficient funds to start research!', 'error'); return;
    }
    const started = Game.tech.startResearch(id, 100);
    if (started) {
      Notify.show(`🔬 Started: ${t.name}`, 'info');
      _renderResearch();
    }
  }

  // ---- PRODUCTION APP ----
  function openProduction() {
    const el = UI.createWindow({
      id: 'production',
      title: '🏭 Production',
      width: 520,
      height: 420,
    });
    _renderProduction();
  }

  function _renderProduction() {
    const body = UI.getWindowBody('production');
    if (!body) return;
    const fabs = Game.production.getFabs();
    const availProc = Game.tech.getAvailableProcesses();
    const has300mm = Game.tech.isResearched('wafer_300mm');

    const fabsHTML = fabs.map(f => `
      <div class="fab-card">
        <div class="fab-card-header">
          <span class="fab-card-title">${f.name}</span>
          <span class="project-badge badge-done">${f.waferSize}</span>
        </div>
        <div class="fab-stats">
          <div><div style="color:var(--text)">Lines</div>${f.lines}</div>
          <div><div style="color:var(--text)">Capacity</div>${f.capacity.toLocaleString()}/mo</div>
          <div><div style="color:var(--text)">Ops Cost</div>${Utils.formatMoney(f.opCostPerMonth,true)}/mo</div>
        </div>
      </div>`).join('') || `<div style="color:var(--text2);font-size:12px;padding:8px 0">No fabs built yet. Build one below.</div>`;

    body.innerHTML = `
      <div class="section-header">Your Fabs</div>
      ${fabsHTML}
      <div class="section-header" style="margin-top:12px">Build New Fab</div>
      <div class="form-group">
        <label class="form-label">Fab Name</label>
        <input type="text" class="form-input" id="fab-name" placeholder="e.g. Fab 1 - Austin" maxlength="30">
      </div>
      <div class="cpu-config-grid">
        <div class="form-group">
          <label class="form-label">Wafer Size</label>
          <select class="form-select" id="fab-wafer" onchange="App._updateFabCost()">
            <option value="200mm">200mm (${Utils.formatMoney(5_000_000,true)}/line)</option>
            ${has300mm ? '<option value="300mm">300mm ('+Utils.formatMoney(50_000_000,true)+'/line)</option>' : ''}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Production Lines: <span id="fab-lines-val">1</span></label>
          <input type="range" class="form-input" id="fab-lines" min="1" max="20" value="1" oninput="document.getElementById('fab-lines-val').textContent=this.value;App._updateFabCost()">
        </div>
      </div>
      <div style="font-size:12px;color:var(--yellow);margin-bottom:10px">
        Total cost: <span id="fab-total-cost">${Utils.formatMoney(5_000_000)}</span>
      </div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn primary" onclick="App._buildFab()">🏭 Build Fab</button>
      </div>
    `;
  }

  function _updateFabCost() {
    const wafer = document.getElementById('fab-wafer')?.value;
    const lines = parseInt(document.getElementById('fab-lines')?.value || 1);
    const perLine = wafer === '300mm' ? 50_000_000 : 5_000_000;
    document.getElementById('fab-total-cost').textContent = Utils.formatMoney(perLine * lines);
  }

  function _buildFab() {
    const name  = document.getElementById('fab-name')?.value.trim();
    const wafer = document.getElementById('fab-wafer')?.value;
    const lines = parseInt(document.getElementById('fab-lines')?.value || 1);
    if (!name) { Notify.show('Enter a fab name!', 'error'); return; }
    const ok = Game.production.buildFab({ name, waferSize: wafer, lines });
    if (ok) _renderProduction();
  }

  // ---- BUSINESS APP ----
  function openBusiness() {
    UI.createWindow({
      id: 'business',
      title: '🤝 Business Deals',
      width: 480,
      height: 360,
    });
    const body = UI.getWindowBody('business');
    body.innerHTML = `
      <div class="section-header">Available Deal Types</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${[
          {icon:'🏭', name:'Foundry Deal',    desc:'Outsource or sell production capacity'},
          {icon:'💰', name:'Acquisition',      desc:'Buy out competitor companies'},
          {icon:'🤝', name:'Joint Venture',    desc:'Co-develop products with partners'},
          {icon:'📜', name:'IP Licensing',     desc:'License your technology'},
        ].map(d => `<div class="hw-type-card" onclick="Notify.show('${d.name} coming soon!','info')" style="opacity:0.6;cursor:not-allowed">
          <span class="hw-icon">${d.icon}</span>
          <div class="hw-name">${d.name}</div>
          <div class="hw-desc">${d.desc}</div>
        </div>`).join('')}
      </div>
      <div style="color:var(--text2);font-size:11px;margin-top:12px;padding:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border)">
        💡 Build your company first. Business deals unlock as you grow.
      </div>
    `;
  }

  // ---- PUBLIC API ----
  function open(appId) {
    if (!Game.state.started) { Notify.show('Start a game first!', 'warn'); return; }
    const map = {
      hardware:   openHardware,
      contracts:  openContracts,
      research:   openResearch,
      production: openProduction,
      business:   openBusiness,
    };
    if (map[appId]) map[appId]();
    else Notify.show('App not found: ' + appId, 'error');
  }

  return {
    open,
    _openCpuCreator, _recalcCpu, _submitCpu,
    _acceptContract,
    _startResearch,
    _buildFab, _updateFabCost,
  };
})();

/* ================================================================
   BOOT — Show New Game window on load
   ================================================================ */
window.addEventListener('load', () => {
  setTimeout(() => {
    UI.openNewGameWindow();
  }, 300);
});
</script>
